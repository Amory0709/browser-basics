<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello course</title>
    <style>
      :root {
        color-scheme: light;
        font-family: 'Segoe UI', system-ui, sans-serif;
        line-height: 1.5;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(160deg, #eff6ff, #fdf2f8);
        color: #0f172a;
      }

      main {
        width: min(92vw, 28rem);
        padding: 1.5rem;
        border-radius: 1rem;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 12px 40px rgba(15, 23, 42, 0.12);
      }

      p.highlight {
        margin: 1rem 0;
        padding: 0.75rem 1rem;
        border-radius: 0.75rem;
        background: #fef9c3;
        transition: background 0.2s ease;
      }

      p.highlight.active {
        background: #fde047;
      }

      .counter {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }

      button {
        font: inherit;
        border: 1px solid #cbd5e1;
        border-radius: 0.6rem;
        padding: 0.45rem 0.9rem;
        background: #fff;
        cursor: pointer;
      }

      #status {
        margin-top: 1rem;
        font-size: 0.9rem;
        color: #475569;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Hello course</h1>
      <p id="lesson" class="highlight">Shared paragraph — everyone sees the same highlight.</p>

      <div class="counter" aria-live="polite">
        <button id="dec" type="button" aria-label="Decrease counter">−</button>
        <strong id="count">0</strong>
        <button id="inc" type="button" aria-label="Increase counter">+</button>
      </div>

      <p id="status">Connecting…</p>
    </main>

    <script src="/embed-sdk.js"></script>
    <script type="module">
      const client = EmbedSDK.createEmbedClient();

      client.ready().then((ctx) => {
        const lesson = document.getElementById('lesson');
        const countEl = document.getElementById('count');
        const status = document.getElementById('status');
        const counter = ctx.getMap('counter');
        const lessonMap = ctx.getMap('lesson');

        status.textContent = `Connected as ${ctx.role} · ${ctx.sessionMode} mode`;

        const renderCount = () => {
          const value = Number(counter.get('value') ?? 0);
          countEl.textContent = String(value);
        };

        const renderLesson = () => {
          const active = Boolean(lessonMap.get('highlight'));
          lesson.classList.toggle('active', active);
        };

        counter.observe(() => renderCount());
        lessonMap.observe(() => renderLesson());
        ctx.onSessionMode((mode) => {
          status.textContent = `Connected as ${ctx.role} · ${mode} mode`;
        });

        document.getElementById('inc').addEventListener('click', () => {
          const next = Number(counter.get('value') ?? 0) + 1;
          counter.set('value', next);
        });
        document.getElementById('dec').addEventListener('click', () => {
          const next = Number(counter.get('value') ?? 0) - 1;
          counter.set('value', next);
        });
        lesson.addEventListener('click', () => {
          lessonMap.set('highlight', !lessonMap.get('highlight'));
        });
      }).catch((error) => {
        document.getElementById('status').textContent = error.message;
      });
    </script>
  </body>
</html>

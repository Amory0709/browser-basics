services:
  - type: web
    name: browser-basics-ws
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: ADMIN_SECRET
        sync: false

  - type: web
    name: browser-basics
    runtime: static
    buildCommand: npm install && npm run build:render
    staticPublishPath: client/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_WS_URL
        value: wss://browser-basics-ws.onrender.com
